<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surahs</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #0f172a;
    font-family: monospace;
    color: white;
}

.title {
    text-align: center;
    margin: 20px 0;
    font-size: 2rem;
}

#ctn {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    padding: 30px;
}

/* Card */
.surah-card {
    background: #020617;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #1e293b;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.surah-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
}

.surah-name {
    font-size: 1.3rem;
    color: #38bdf8;
    margin-bottom: 10px;
}

.surah-number {
    font-size: 0.9rem;
    opacity: 0.8;
}
</style>
<body>

    <h1 class="title">📖 List of Surahs</h1>
    <div id="ctn"></div>


    hsjdhsjhdjs
    sdksjdksa

    sdsdas

 <script>
const ctn = document.getElementById("ctn");

fetch("http://api.alquran.cloud/v1/surah")
    .then(response => response.json())
    .then(data => {
        const surah = data.data;

        surah.forEach(item => {
            const surah_card = document.createElement("div");
            surah_card.className = "surah-card";

            surah_card.innerHTML = `
                <div class="surah-name">${item.name}</div>
                <div class="surah-number">Surah Number: ${item.number}</div>
            `;

            ctn.appendChild(surah_card);
        });
    })
    .catch(err => console.error(err));
</script>
</body>
</html>
